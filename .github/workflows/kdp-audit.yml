name: KDP Quality Audit
on:
  push:
    paths:
      - 'books/**'
      - 'tools/**'
      - '.github/workflows/kdp-audit.yml'
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Check Halloween manuscript
        run: python tools/kdp_check.py books/halloween-2026 --out report.json --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kdp-quality-report
          path: report.json
